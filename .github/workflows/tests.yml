name: Build and Test

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

permissions:
  pull-requests: write

jobs:
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/dashboard-django/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/dashboard-django
        run: npm ci

      - name: Run frontend tests
        working-directory: ./apps/dashboard-django
        run: npm test

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulso
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        working-directory: ./apps/etl-python
        run: uv python install

      - name: Install dependencies
        working-directory: ./apps/etl-python
        run: uv sync

      - name: Create test database
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -c "CREATE DATABASE pulso_test;"

      - name: Run unit tests
        working-directory: ./apps/etl-python
        run: uv run pytest -m "not integration" -v

      - name: Run integration tests
        working-directory: ./apps/etl-python
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: uv run pytest -m integration -v

      - name: Run all tests (unit + integration)
        working-directory: ./apps/etl-python
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: uv run pytest -v

      - name: Comment test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = '## Build and Test Results\n\n' +
              '- Unit tests: Passed\n' +
              '- Integration tests: Passed\n';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
