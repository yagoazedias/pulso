name: Docker Build

on:
  push:
    branches: [ master, main ]
    paths:
      - 'apps/etl-clojure/Dockerfile'
      - 'apps/dashboard-django/Dockerfile'
      - 'docker-compose.yml'
      - 'apps/etl-clojure/src/**'
      - 'apps/etl-clojure/resources/**'
      - 'apps/dashboard-django/**'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'apps/etl-clojure/Dockerfile'
      - 'apps/dashboard-django/Dockerfile'
      - 'docker-compose.yml'
      - 'apps/etl-clojure/src/**'
      - 'apps/etl-clojure/resources/**'
      - 'apps/dashboard-django/**'

jobs:
  docker-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ETL Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/etl-clojure
          push: false
          tags: pulso-etl:latest
          cache-from: type=gha,scope=etl
          cache-to: type=gha,mode=max,scope=etl

  docker-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dashboard Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/dashboard-django
          push: false
          tags: pulso-dashboard:latest
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

  docker-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Build all services
        run: docker compose build

      - name: Verify services
        run: docker compose ps -a || true
